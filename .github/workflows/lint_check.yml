name: Python Lint
on:
  push:
    paths:
      - 'scripts/**.py'
      - 'docker/**/*.py'
  pull_request:
    paths:
      - 'scripts/**.py'
      - 'docker/**/*.py'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff (errors only, no style)
        run: ruff check scripts/ docker/ --select E9,F6,F7,F8 --ignore F811 || true
