# Resource limits summary (see individual compose files for full config):
#
#   Service         Compose file                   mem_limit   cpus
#   --------------- ------------------------------ ----------- -----
#   data-collector  docker-compose.collect.yml     512m        0.5
#   file-watcher    docker-compose.train.yml       256m        0.25
#   trainer         docker-compose.train.yml       2g          2.0
#   firmware        docker-compose.yml (below)     2g          1.0
#   flutter         docker-compose.yml (below)     4g          2.0
#   ml              docker-compose.yml (below)     4g          2.0

services:

  firmware:
    build:
      context: .
      dockerfile: docker/firmware/Dockerfile
    volumes:
      - ./.pio:/workspace/.pio
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    # Output: .pio/build/m5stick-c-plus2/firmware.bin

  flutter:
    build:
      context: .
      dockerfile: docker/flutter/Dockerfile
    volumes:
      - ./app/build:/app/build
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1500M
    # Output: app/build/app/outputs/flutter-apk/app-release.apk

  ml:
    build:
      context: .
      dockerfile: docker/ml/Dockerfile
    volumes:
      - ./app/assets/ml:/workspace/app/assets/ml
      - ./data:/workspace/data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
    # Output: app/assets/ml/*.tflite + *.json
