# docker-compose.train.yml
# Run alongside docker-compose.collect.yml to enable data-triggered retraining.
# Usage: docker compose -f docker-compose.train.yml up
#
# The trainer mounts /var/run/docker.sock to trigger a flutter APK build
# after each retraining run (Docker-in-Docker).  Remove that volume if
# you do not want automatic APK builds.

services:

  file-watcher:
    build:
      context: .
      dockerfile: docker/watcher/Dockerfile
    volumes:
      - ./data:/workspace/data
    environment:
      - DATA_DIR=/workspace/data
      - TRIGGER_THRESHOLD=100
      - POLL_INTERVAL=60
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    restart: unless-stopped

  trainer:
    build:
      context: .
      dockerfile: docker/ml/Dockerfile
    volumes:
      - ./data:/workspace/data
      - ./app/assets/ml:/workspace/app/assets/ml
      - ./app/build:/workspace/app/build
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/workspace/docker-compose.yml:ro
    environment:
      - DATA_DIR=/workspace/data
    entrypoint: ["python", "scripts/run_pipeline.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if os.path.exists('/workspace/data') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.50'
          memory: 512M
    restart: "no"
