global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # External labels are attached to all time series and alerts sent to
  # external systems (Alertmanager, remote_write, etc.)
  external_labels:
    project: 'ancientvision'
    environment: 'production'

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # Flask data collector — exposes custom metrics via prometheus_flask_exporter.
  # The collector must have prometheus_flask_exporter installed and the /metrics
  # route registered (see docker/collect/app.py).  Without it, Prometheus will
  # mark this target as DOWN but will not crash.
  - job_name: 'ancientvision-collector'
    scrape_interval: 10s      # faster than global for safety-critical data
    static_configs:
      - targets: ['data-collector:8765']
    metrics_path: '/metrics'
    # Expected custom metrics exposed by the collector:
    #   ancientvision_samples_total          - counter, labelled by device_id and label
    #   ancientvision_devices_active         - gauge
    #   ancientvision_rate_limit_hits_total  - counter
    #   ancientvision_samples_by_class       - gauge, labelled by label
    #   http_request_duration_seconds        - histogram (from prometheus_flask_exporter)
    #   http_requests_total                  - counter, labelled by status

  # Prometheus self-monitoring — tracks scrape durations, rule eval latency, etc.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
