name: Data Quality Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC

jobs:
  data-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install flask werkzeug
      - name: Run data drift check (synthetic test)
        run: |
          # Check that the drift detection script runs without errors
          python scripts/data_drift_check.py --data-dir ./data/field 2>&1 || echo "No field data (expected in CI)"
      - name: Run aggregate stats (synthetic test)
        run: |
          python scripts/aggregate_stats.py --data-dir ./data/field 2>&1 || echo "No field data (expected in CI)"
      - name: Run field report (synthetic test)
        run: |
          python scripts/field_report.py --data-dir ./data/field 2>&1 || echo "No field data (expected in CI)"
      - name: Validate model configs
        run: |
          python3 - <<'EOF'
          import json, os
          configs = [
              "app/assets/ml/precursor_classifier_config.json",
              "app/assets/ml/precursor_classifier_scaler.json",
              "app/assets/ml/vibration_model_config.json",
              "app/assets/ml/vibration_scaler.json",
          ]
          for path in configs:
              if os.path.isfile(path):
                  with open(path) as f:
                      data = json.load(f)
                  print(f"✓ Valid JSON: {path}")
              else:
                  print(f"  Missing (not yet trained): {path}")
          EOF
