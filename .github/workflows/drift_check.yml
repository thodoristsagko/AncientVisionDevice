name: Data Drift Check
on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6am
  workflow_dispatch:

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy
      - name: Run drift detector
        run: |
          python scripts/data_drift_detector.py --data-dir data/ || echo "No data to check"
        continue-on-error: true
      - name: Run retrain advisor
        run: |
          python scripts/retrain_advisor.py --data-dir data/ || echo "No data to check"
        continue-on-error: true
