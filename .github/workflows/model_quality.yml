name: ML Model Quality Gate

on:
  push:
    branches: [master, docker-experiment]
    paths:
      - 'scripts/generate_precursor_data.py'
      - 'scripts/train_precursor_classifier.py'
      - 'scripts/train_anomaly_detector.py'
      - 'scripts/training_smoke_test.py'
      - 'app/assets/ml/**'
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install numpy tensorflow==2.15.1 scikit-learn

      - name: Check model artifacts exist
        run: |
          echo "## Model Artifacts Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          python3 - <<'EOF'
          import os

          artifacts = [
              "app/assets/ml/precursor_classifier.tflite",
              "app/assets/ml/anomaly_detector.tflite",
              "app/assets/ml/precursor_classifier_config.json",
              "app/assets/ml/precursor_classifier_scaler.json",
              "app/assets/ml/vibration_model_config.json",
              "app/assets/ml/vibration_scaler.json",
          ]

          found = 0
          for artifact in artifacts:
              status = "✓" if os.path.isfile(artifact) else "✗"
              print(f"{status} {artifact}")
              if os.path.isfile(artifact):
                  found += 1

          print(f"\nFound {found}/{len(artifacts)} model artifacts")
          EOF

      - name: Validate model configs and scalers
        run: |
          python3 - <<'EOF'
          import json
          import sys
          import os

          pairs = [
              ("app/assets/ml/precursor_classifier_config.json",
               "app/assets/ml/precursor_classifier_scaler.json"),
              ("app/assets/ml/vibration_model_config.json",
               "app/assets/ml/vibration_scaler.json"),
          ]

          all_ok = True
          for cfg_path, scaler_path in pairs:
              if not os.path.isfile(cfg_path):
                  print(f"INFO: {cfg_path} not found (first-time setup)")
                  continue

              with open(cfg_path) as f:
                  cfg = json.load(f)

              if not os.path.isfile(scaler_path):
                  print(f"ERROR: {scaler_path} missing but {cfg_path} exists")
                  all_ok = False
                  continue

              with open(scaler_path) as f:
                  scaler = json.load(f)

              cfg_dim = len(cfg.get("feature_names", []))
              scaler_dim = len(scaler.get("mean", []))

              if cfg_dim == scaler_dim:
                  print(f"✓ {cfg_path}: {cfg_dim} features, scaler dims match")
              else:
                  print(f"ERROR: {cfg_path} has {cfg_dim} features, but scaler has {scaler_dim} dimensions")
                  all_ok = False

          if not all_ok:
              sys.exit(1)
          EOF

      - name: Check training metrics quality thresholds
        run: |
          python3 - <<'EOF'
          import json
          import os
          import sys

          metrics_path = "app/assets/ml/precursor_training_metrics.json"

          if not os.path.isfile(metrics_path):
              print("INFO: No training metrics found (models not yet trained)")
              sys.exit(0)

          with open(metrics_path) as f:
              metrics = json.load(f)

          print("## Training Quality Metrics")
          print("")

          thresholds = {
              "f1_score": 0.70,
              "accuracy": 0.75,
              "precision": 0.70,
              "recall": 0.70,
          }

          all_ok = True
          for metric, threshold in thresholds.items():
              value = metrics.get(metric, 0)
              status = "✓" if value >= threshold else "⚠"
              print(f"{status} {metric}: {value:.4f} (threshold: {threshold})")
              if value < threshold:
                  all_ok = False

          # Check cross-validation scores
          cv_scores = metrics.get("cv_scores", [])
          if cv_scores:
              cv_mean = sum(cv_scores) / len(cv_scores)
              cv_std = (sum((x - cv_mean) ** 2 for x in cv_scores) / len(cv_scores)) ** 0.5
              print(f"\nCross-validation (5-fold):")
              print(f"  Mean: {cv_mean:.4f}")
              print(f"  StdDev: {cv_std:.4f}")

          if not all_ok:
              print("\n::warning::Some metrics below thresholds")

          sys.exit(0)
          EOF

      - name: Validate TFLite model structure
        run: |
          python3 - <<'EOF'
          import json
          import os
          import sys

          tflite_models = [
              "app/assets/ml/precursor_classifier.tflite",
              "app/assets/ml/anomaly_detector.tflite",
          ]

          print("## TFLite Model Structure Validation")
          print("")

          for model_path in tflite_models:
              if not os.path.isfile(model_path):
                  print(f"INFO: {model_path} not found (not yet built)")
                  continue

              size_kb = os.path.getsize(model_path) / 1024
              print(f"✓ {model_path}: {size_kb:.2f} KB")

              # Validate it's a valid TFLite file (magic bytes)
              try:
                  with open(model_path, 'rb') as f:
                      magic = f.read(4)
                      if magic == b'TFL3':
                          print(f"  ✓ Valid TFLite file signature")
                      else:
                          print(f"  ✗ Invalid TFLite file signature: {magic}")
                          sys.exit(1)
              except Exception as e:
                  print(f"  ✗ Error reading file: {e}")
                  sys.exit(1)

          sys.exit(0)
          EOF

      - name: Run training smoke test (optional)
        if: hashFiles('scripts/training_smoke_test.py') != ''
        run: |
          python scripts/training_smoke_test.py --timeout 120 || echo "INFO: Smoke test skipped or failed"
        timeout-minutes: 3
        continue-on-error: true

      - name: Run model probability checks
        if: hashFiles('scripts/test_model_probabilities.py') != ''
        run: |
          python -m pytest scripts/test_model_probabilities.py -v --tb=short || echo "INFO: Probability checks skipped"
        continue-on-error: true

      - name: Upload model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-quality-report
          path: |
            app/assets/ml/*.json
            app/assets/ml/*.tflite
          if-no-files-found: ignore
          retention-days: 30

      - name: Quality gate summary
        if: always()
        run: |
          echo "## Model Quality Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✓ Config/scaler dimension validation passed" >> $GITHUB_STEP_SUMMARY
          echo "✓ TFLite model structure validation passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check artifacts above for detailed metrics." >> $GITHUB_STEP_SUMMARY
