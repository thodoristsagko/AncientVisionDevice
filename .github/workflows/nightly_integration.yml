name: Nightly Integration Tests

on:
  schedule:
    - cron: '0 2 * * *'  # 2am UTC daily
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flask werkzeug pytest pytest-cov pytest-timeout
          pip install -r docker/collect/requirements.txt
          pip install -r docker/ml/requirements.txt

      - name: Run integration tests
        run: |
          python -m pytest \
            scripts/test_integration.py \
            docker/collect/test_app.py \
            -v \
            --timeout=30 \
            --tb=short \
            || true

      - name: Run end-to-end pipeline test
        run: |
          python -m pytest \
            scripts/test_run_pipeline.py \
            scripts/test_simulate.py \
            -v \
            --timeout=60 \
            --tb=short \
            || true

      - name: Run data pipeline health check (offline mode)
        run: |
          python scripts/health_check.py --timeout 5 || echo "INFO: Health check returned non-zero (expected in offline mode)"

      - name: Validate sample training data
        run: |
          if [ -f "scripts/validate_training_data.py" ]; then
            python scripts/validate_training_data.py --data-dir ./data || echo "INFO: No training data to validate"
          else
            echo "INFO: validate_training_data.py not found"
          fi

      - name: Check model quality thresholds
        run: |
          python3 - <<'EOF'
          import json
          import os

          # Check if model training metrics exist and meet thresholds
          metrics_path = "app/assets/ml/precursor_training_metrics.json"
          if os.path.isfile(metrics_path):
              with open(metrics_path) as f:
                  metrics = json.load(f)

              f1_score = metrics.get("f1_score", 0)
              accuracy = metrics.get("accuracy", 0)
              precision = metrics.get("precision", 0)

              print(f"Model Quality Metrics:")
              print(f"  F1 Score: {f1_score:.4f}")
              print(f"  Accuracy: {accuracy:.4f}")
              print(f"  Precision: {precision:.4f}")

              if f1_score < 0.75:
                  print(f"::warning::F1 Score {f1_score} below 0.75 threshold")
              if accuracy < 0.80:
                  print(f"::warning::Accuracy {accuracy} below 0.80 threshold")
          else:
              print("INFO: No training metrics found (models not yet trained)")
          EOF

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-integration-results
          path: |
            .pytest_cache
            htmlcov
            coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Nightly integration tests failed. Check logs for details."
          exit 1
