name: Python Tests
on:
  push:
    branches: [master, docker-experiment]
  pull_request:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install pytest pytest-cov pandas numpy scikit-learn flask==3.0.3 werkzeug==3.0.3 google-cloud-firestore==2.16.0
          pip install tflite-runtime 2>/dev/null || pip install pytest pytest-cov pandas numpy scikit-learn
      - name: Run tests with coverage
        run: |
          python -m pytest \
            -v \
            --cov=scripts --cov=docker \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "*.xml"
          if-no-files-found: ignore
