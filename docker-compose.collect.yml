# docker-compose.collect.yml
# Run on field laptop to collect vibration data from M5StickC and Firestore.
# Usage: docker compose -f docker-compose.collect.yml up
#
# Optional Firestore sync: set GOOGLE_APPLICATION_CREDENTIALS to the path of a
# GCP service account JSON on the host, e.g.:
#   GOOGLE_APPLICATION_CREDENTIALS=/path/to/creds.json \
#   docker compose -f docker-compose.collect.yml up
#
# Data persistence:
#   - ./data          — bind-mount for easy host access to CSVs
#
# Backup:   tar czf field-data-backup.tar.gz -C ./data .
# Restore:  tar xzf field-data-backup.tar.gz -C ./data

services:

  data-collector:
    build:
      context: .
      dockerfile: docker/collect/Dockerfile
    ports:
      - "8765:8765"
    volumes:
      - ./data:/workspace/data
    environment:
      - DATA_DIR=/workspace/data
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      - FIRESTORE_COLLECTION=${FIRESTORE_COLLECTION:-vibration_samples}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
