name: Python Tests
on:
  push:
    branches: [master, docker-experiment]
  pull_request:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install flask==3.0.3 werkzeug==3.0.3 google-cloud-firestore==2.16.0 pytest==8.1.1
      - name: Run tests
        run: python -m pytest docker/collect/test_app.py docker/watcher/test_watch.py scripts/test_run_pipeline.py scripts/test_simulate.py -v --tb=short
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "*.xml"
          if-no-files-found: ignore
