; PlatformIO Project Configuration File
; AncientVision BLE Sensor Device v5.0
; Board: M5StickC Plus 2

[env:m5stick-c-plus2]
platform = espressif32@6.4.0
board = m5stick-c
framework = arduino
monitor_speed = 115200

; Required libraries for v5.0 firmware
lib_deps =
    m5stack/M5Unified@^0.1.13
    arduino-libraries/Madgwick@^1.2.0

; Build flags
build_flags =
    -DARDUINO_M5STICK_C_PLUS2
