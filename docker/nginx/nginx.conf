events { worker_connections 1024; }

http {
    # Upstream with keepalive connections
    upstream data_collector {
        server data-collector:8765;
        keepalive 16;
    }

    # Custom access log format with request time
    log_format combined_rt '$remote_addr - [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           'rt=$request_time';
    access_log /var/log/nginx/access.log combined_rt;

    # Gzip compression
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;
    gzip_proxied any;

    # Rate limit zones
    limit_req_zone $binary_remote_addr zone=collect:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    server {
        listen 80;
        server_name _;

        # Client body size limit
        client_max_body_size 64k;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer" always;

        # Health check passthrough — no rate limit, needed for Docker healthchecks
        location /health {
            proxy_pass http://data_collector;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # /collect — stricter rate limit (field devices posting sensor data)
        location /collect {
            limit_req zone=collect burst=10 nodelay;
            proxy_pass http://data_collector;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # All other API endpoints
        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://data_collector;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Block common attack patterns
        location ~* /(admin|wp-admin|\.env|\.git) {
            return 403;
        }
    }
}
