name: Performance Benchmark

on:
  push:
    branches: [docker-experiment]
    paths:
      - 'scripts/**'
      - 'docker/**'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  inference-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install numpy tensorflow-cpu==2.15.1

      - name: Generate test data
        run: |
          python scripts/generate_precursor_data.py --output /tmp/benchmark_data 2>/dev/null || true

      - name: Run inference benchmark
        run: |
          if [ -f scripts/inference_benchmark.py ]; then
            python scripts/inference_benchmark.py --n-runs 50 --model both 2>&1 | tee benchmark_results.txt || true
          else
            echo "inference_benchmark.py not found — skipping" | tee benchmark_results.txt
          fi

      - name: Post benchmark summary
        if: always()
        run: |
          echo "## Inference Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat benchmark_results.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.txt
          retention-days: 30

  api-load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install flask werkzeug requests

      - name: Validate load test script
        run: |
          if [ -f scripts/load_test.py ]; then
            python -m py_compile scripts/load_test.py && echo "Script syntax OK" | tee load_test_results.txt
          else
            echo "load_test.py not found — skipping" | tee load_test_results.txt
          fi

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: load_test_results.txt
          retention-days: 30
