# deployment_check.yml — AncientVision Deployment Readiness Check
#
# Verifies that all ML model assets, scaler files, and required scripts are
# present and valid before any field deployment.  Intended as a lightweight
# gate that does NOT require Docker or Flutter toolchains.
#
# Triggers:
#   - Push to docker-experiment branch
#   - Manual workflow_dispatch (run-button in GitHub UI)
#   - Weekly scheduled run: every Sunday at 09:00 UTC

name: Deployment Readiness Check

on:
  push:
    branches:
      - docker-experiment
  workflow_dispatch:
  schedule:
    # Every Sunday at 09:00 UTC
    - cron: "0 9 * * 0"

jobs:
  deployment-readiness:
    name: Deployment Readiness Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Run deployment readiness check
        id: readiness
        run: |
          echo "Running deployment_readiness.py ..."
          python scripts/deployment_readiness.py | tee deployment_readiness_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        continue-on-error: true

      - name: Append raw output to step summary
        if: always()
        run: |
          {
            echo ""
            echo "## Raw Output"
            echo '```'
            cat deployment_readiness_output.txt || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload readiness report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-readiness-report
          path: deployment_readiness_output.txt
          retention-days: 30

      - name: Fail job if checks did not pass
        if: steps.readiness.outcome == 'failure' || steps.readiness.outputs.exit_code != '0'
        run: |
          echo "::error::One or more deployment readiness checks FAILED."
          echo "See the step summary and artifact for details."
          exit 1
