name: Integration Tests

on:
  push:
    branches: [docker-experiment]
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      # No external services needed — tests use Flask test client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install flask werkzeug pytest pytest-cov
      - name: Run integration tests
        run: |
          python -m pytest scripts/test_integration.py -v --timeout=30
      - name: Run collect endpoint tests
        run: |
          python -m pytest docker/collect/test_app.py -v
