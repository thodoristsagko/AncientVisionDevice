services:

  firmware:
    build:
      context: .
      dockerfile: docker/firmware/Dockerfile
    volumes:
      - ./.pio:/workspace/.pio
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    # Output: .pio/build/m5stick-c-plus2/firmware.bin

  flutter:
    build:
      context: .
      dockerfile: docker/flutter/Dockerfile
    volumes:
      - ./app/build:/app/build
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
        reservations:
          cpus: '1.0'
          memory: 1500M
    # Output: app/build/app/outputs/flutter-apk/app-release.apk

  ml:
    build:
      context: .
      dockerfile: docker/ml/Dockerfile
    volumes:
      - ./app/assets/ml:/workspace/app/assets/ml
      - ./data:/workspace/data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    # Output: app/assets/ml/*.tflite + *.json
