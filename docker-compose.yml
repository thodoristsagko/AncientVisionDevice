services:

  firmware:
    build:
      context: .
      dockerfile: docker/firmware/Dockerfile
    volumes:
      - ./.pio:/workspace/.pio
    # Output: .pio/build/m5stick-c-plus2/firmware.bin

  flutter:
    build:
      context: .
      dockerfile: docker/flutter/Dockerfile
    volumes:
      - ./app/build:/app/build
    # Output: app/build/app/outputs/flutter-apk/app-release.apk

  ml:
    build:
      context: .
      dockerfile: docker/ml/Dockerfile
    volumes:
      - ./app/assets/ml:/workspace/app/assets/ml
      - ./data:/workspace/data
    # Output: app/assets/ml/*.tflite + *.json
