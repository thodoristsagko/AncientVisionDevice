name: Python Tests
on:
  push:
    branches: [master, docker-experiment]
  pull_request:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install flask==3.0.3 werkzeug==3.0.3 google-cloud-firestore==2.16.0 pytest==8.1.1
      - name: Run tests with coverage
        run: |
          pip install pytest-cov
          python -m pytest \
            docker/collect/test_app.py \
            docker/watcher/test_watch.py \
            scripts/test_run_pipeline.py \
            scripts/test_simulate.py \
            scripts/test_integration.py \
            scripts/test_field_report.py \
            scripts/test_reset_pipeline.py \
            scripts/test_training_quality.py \
            -v \
            --cov=docker/collect \
            --cov=docker/watcher \
            --cov=scripts \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            || true
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "*.xml"
          if-no-files-found: ignore
